services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluesia-web
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bluesia-net

networks:
  bluesia-net:
    driver: bridge
