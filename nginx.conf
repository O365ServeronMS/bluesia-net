server {
    listen 80;
    server_name bluesia.net www.bluesia.net;

    root /usr/share/nginx/html;
    index index.html;

    # ── Charset ───────────────────────────────────────────────
    charset utf-8;

    # ── Performance Directives ────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 100;

    # Cache open file descriptors in memory
    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── Gzip Compression ──────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_static       on;        # serve pre-compressed .gz files if available
    gzip_proxied      any;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                  always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header X-XSS-Protection       "1; mode=block"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # ── HTML — Always fresh (no browser cache) ────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        add_header X-Frame-Options        "SAMEORIGIN"              always;
        add_header X-Content-Type-Options "nosniff"                 always;
    }

    # ── CSS / JS — versioned, cache 7 days ───────────────────
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Vary          "Accept-Encoding";
        access_log off;
        etag on;
    }

    # ── WebP — 1 year (immutable, served via picture element) ─
    location ~* \.webp$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary          "Accept";
        access_log off;
        etag on;
    }

    # ── Images / Fonts — 1 year ───────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary          "Accept-Encoding";
        access_log off;
        etag on;
    }

    # ── SPA / Default ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # Default moderate cache for other resources
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Error Pages ───────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
