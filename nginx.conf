server {
    listen 80;
    server_name bluesia.net www.bluesia.net;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ── Performance ───────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Cache file descriptors in memory
    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── Gzip (dynamic + static pre-compressed) ────────────────
    gzip              on;
    gzip_vary         on;
    gzip_static       on;      # serve .gz pre-compressed files
    gzip_proxied      any;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/avif
        font/woff
        font/woff2;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-XSS-Protection       "1; mode=block"                    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # ── MIME types for modern formats ─────────────────────────
    types {
        include /etc/nginx/mime.types;
        image/avif avif;
        image/webp webp;
    }

    # ── HTML — always fresh ───────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        add_header Expires       "0"                                   always;
        etag on;
    }

    # ── robots.txt / sitemap.xml — short cache ────────────────
    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── CSS / JS — 7 days ─────────────────────────────────────
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Vary          "Accept-Encoding";
        access_log off;
        etag on;
    }

    # ── Images — 1 year immutable ─────────────────────────────
    # Covers AVIF, WebP, PNG, JPG, SVG, GIF, ICO
    location ~* \.(avif|webp|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary          "Accept";
        access_log off;
        etag on;
    }

    # ── Fonts — 1 year immutable ──────────────────────────────
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary          "Accept-Encoding";
        access_log off;
    }

    # ── Default / SPA fallback ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Error pages ───────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
